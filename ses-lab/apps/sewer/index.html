<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SES — sewer</title><body style="background:#f3eadb;font-family:Tahoma;text-align:center"><p id="boot">جارٍ تحميل البرنامج…</p><script>
(async()=>{try{
 const id='sewer',spec={"engine": 2516029, "files": {"sewer-notifications.js": 1585, "sewer-label-style.js": 6121, "sewer-delete.js": 5316, "sewer-context-ui.js": 28118, "sewer-history.js": 7317, "sewer-real-assets.js": 21797, "sewer-appearance-ui.js": 6913, "sewer-navigation.js": 4217, "sewer-project-dialog.js": 3544, "sewer-session.js": 11980, "sewer-selected-view.js": 2052, "sewer-rail-layout.js": 1144, "sewer-piece-popovers.js": 6392, "sewer-color-guide.js": 18006, "sewer-header-v130.js": 20428, "sewer-side-ui.js": 3961, "sewer-mobile-v137.js": 973, "../../isolate.js": 1826, "ses-adapter.js": 5619}},total=spec.engine+Object.values(spec.files).reduce((a,b)=>a+b,0);
 const report=loaded=>parent.postMessage({type:'ses-load-progress',stage:id,loaded,total},location.origin);
 let received=0;report(0);
 const response=await fetch('engine.html');if(!response.ok)throw Error('تعذّر تحميل ملف البرنامج');
 let html='';
 if(response.body?.getReader){const reader=response.body.getReader(),decoder=new TextDecoder();while(true){const part=await reader.read();if(part.done)break;received+=part.value.byteLength;html+=decoder.decode(part.value,{stream:true});report(Math.min(received,spec.engine));}html+=decoder.decode();}
 else{html=await response.text();received=spec.engine;report(received)}
 function installTracking(id,spec,received){
  const weights=new Map(Object.entries(spec.files).map(([path,size])=>[new URL(path,location.href).pathname,size])),done=new Set(),total=spec.engine+Object.values(spec.files).reduce((a,b)=>a+b,0);let loaded=Math.min(received,spec.engine);
  const report=()=>parent.postMessage({type:'ses-load-progress',stage:id,loaded,total},location.origin);
  document.addEventListener('load',event=>{const el=event.target;if(el.tagName!=='SCRIPT'||!el.src)return;const key=new URL(el.src,location.href).pathname;if(weights.has(key)&&!done.has(key)){done.add(key);loaded+=weights.get(key);report()}},true);
  document.addEventListener('error',event=>{if(event.target.tagName==='SCRIPT'&&event.target.src&&weights.has(new URL(event.target.src,location.href).pathname))parent.postMessage({type:'ses-load-error',stage:id,message:'تعذّر تحميل أحد ملفات البرنامج. تحقق من الاتصال ثم أعد المحاولة.'},location.origin)},true);
  report();
 }
 html=html.replace('<html','<html data-ses-stage="'+id+'"');
 const urls=[...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["']/gi)].map(m=>m[1]);
 const preloads=[...new Set(urls)].map(src=>'<link rel="preload" as="script" href="'+src.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">').join('');
 const tracking='<script>('+installTracking.toString()+')('+JSON.stringify(id)+','+JSON.stringify(spec)+','+received+');<\/script>';
 html=html.replaceAll('https://sadeer66.github.io/sadeer/assets/','assets/');
 const head=html.indexOf('>',html.indexOf('<head'))+1;
 html=html.slice(0,head)+preloads+tracking+'<style>#fpSplash,#splash,#sewerOfflineState{display:none!important}</style><script src="../../isolate.js?v=four7"><\/script>'+html.slice(head);
 html=html.replace("if('caches' in window)","if(false)");
 const end=html.lastIndexOf('</body>');
 html=html.slice(0,end)+'<script src="ses-adapter.js?v=four7"><\/script><script>for(const ev of ["input","change","pointerup"])document.addEventListener(ev,()=>parent.postMessage("ses-dirty",location.origin),{passive:true});<\/script>'+html.slice(end);
 document.open();document.write(html);document.close();
}catch(error){parent.postMessage({type:'ses-load-error',stage:'sewer',message:error.message},location.origin);const boot=document.getElementById('boot');if(boot)boot.textContent=error.message}})();
</script></body></html>
