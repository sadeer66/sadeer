 let html='';
 if(response.body?.getReader){const reader=response.body.getReader(),decoder=new TextDecoder();while(true){const part=await reader.read();if(part.done)break;received+=part.value.byteLength;html+=decoder.decode(part.value,{stream:true});report(Math.min(received,spec.engine));}html+=decoder.decode();}
 else{html=await response.text();received=spec.engine;report(received)}
 function installTracking(id,spec,received){
  const weights=new Map(Object.entries(spec.files).map(([path,size])=>[new URL(path,location.href).pathname,size])),done=new Set(),total=spec.engine+Object.values(spec.files).reduce((a,b)=>a+b,0);let loaded=Math.min(received,spec.engine);

  document.addEventListener('load',event=>{const el=event.target;if(el.tagName!=='SCRIPT'||!el.src)return;const key=new URL(el.src,location.href).pathname;if(weights.has(key)&&!done.has(key)){done.add(key);loaded+=weights.get(key);report()}},true);
  document.addEventListener('error',event=>{if(event.target.tagName==='SCRIPT'&&event.target.src&&weights.has(new URL(event.target.src,location.href).pathname))parent.postMessage({type:'ses-load-error',stage:id,message:'تعذّر تحميل أحد ملفات البرنامج. تحقق من الاتصال ثم أعد المحاولة.'},location.origin)},true);
  report();
 }

 document.open();document.write(html);document.close();
}catch(error){parent.postMessage({type:'ses-load-error',stage:'furni',message:error.message},location.origin);const boot=document.getElementById('boot');if(boot)boot.textContent=error.message}})();
</script></body></html>
