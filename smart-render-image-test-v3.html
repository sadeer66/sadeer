<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Render Image Test</title><style>body{background:#102b47;color:white;font:18px system-ui;padding:22px}img{max-width:100%;max-height:65vh;display:block;margin:18px auto}button,input{font-size:18px;margin:12px 0}#status{white-space:pre-wrap}</style><h2>اختبار فتح الصور — Smart Render</h2><p>اختر صورة من الجهاز لتظهر هنا.</p><input id="file" type="file" accept="image/*"><p id="status">بانتظار الصورة</p><img id="preview" alt=""><script>const f=document.getElementById('file'),s=document.getElementById('status'),i=document.getElementById('preview');let url;f.addEventListener('change',()=>{const x=f.files?.[0];if(!x)return;s.textContent='تم اختيار: '+x.name+' — '+x.type+' — '+x.size+' بايت';if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(x);i.onload=()=>s.textContent+='\nتم عرض الصورة بنجاح ✓';i.onerror=()=>s.textContent+='\nفشل عرض الصورة. جرّب JPG أو PNG';i.src=url})</script></html>
