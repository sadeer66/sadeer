<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SewerPlan V61.1 — نسخة تجريبية</title></head><body style="margin:0;padding:22px;background:#0f172a;color:#fff;font:16px Tahoma,Arial;text-align:center"><p>جارٍ فتح برنامج المجاري SewerPlan V61.1...</p><script>(async()=>{try{const sections=[];for(let i=0;i<21;i++){const r=await fetch('./parts/p'+String(i).padStart(2,'0')+'.txt',{cache:'no-store'});if(!r.ok)throw Error('خطأ تحميل المقطع '+(i+1));sections.push(await r.text());}document.open();document.write(sections.join(''));document.close()}catch(e){document.body.innerHTML='<h3>تعذر فتح النسخة التجريبية</h3><p>'+e.message+'</p><p>أعد تحديث الصفحة أو افتحها من Safari.</p>'}})();</script></body></html>
