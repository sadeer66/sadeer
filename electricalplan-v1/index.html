<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8efe2"><title>كهرباء Electric | ElectricalPlan</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#f8efe2}#app{position:absolute;inset:0;width:100%;height:100%;border:0}#brand{display:none!important}#brand b{color:#c58b2e}#brand span{color:#151515}#library{position:absolute;z-index:11;bottom:12px;left:12px;background:#faf3e9;border:1px solid #c58b2e;border-radius:12px;box-shadow:0 4px 15px #0003;max-width:min(460px,90vw);max-height:60vh;overflow:auto;display:none;padding:12px}#library.open{display:block}#toggle{position:absolute;z-index:12;bottom:12px;left:12px;background:#c58b2e;color:#111;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}#library.open+#toggle{bottom:calc(min(45vh, 360px) + 20px)}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{border:1px solid #c58b2e;background:white;border-radius:8px;padding:7px;cursor:pointer}.tabs button.active{background:#c58b2e}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.items img{width:100%;aspect-ratio:1;object-fit:contain;background:white;border-radius:8px}.items small{font-size:10px}#notice{font-size:11px;color:#555;margin:8px 0}</style></head><body><iframe id="app" src="core.html" title="ElectricalPlan workspace"></iframe><div id="brand"><b>كهرباء</b><span> Electric</span></div><div id="library"><strong>مكتبة الكهرباء</strong><p id="notice">المكتبة المرجعية — لإدراج القطع على الخارطة استخدم مكتبة الأثاث داخل مساحة العمل.</p><div class="tabs" id="tabs"></div><div class="items" id="items"></div></div><button id="toggle">⚡ مكتبة الكهرباء</button><script>
const cats=[{n:'الأجهزة الكهربائية',files:['v174/أجهزة كهربائية/aran0249.webp','v174/أجهزة كهربائية/mpby8642.webp']},{n:'التبريد',files:['v181/cooling_01.webp','v181/cooling_02.webp','v181/cooling_03.webp']},{n:'المطبخ',files:Array.from({length:15},(_,i)=>'v179/kitchen_'+String(i+1).padStart(2,'0')+'.webp')},{n:'الإنارة',files:Array.from({length:13},(_,i)=>'../../assets/v196/lighting/'+String(i+1).padStart(2,'0')+'.webp')}];let active=0;const library=document.querySelector('#library'),tabs=document.querySelector('#tabs'),items=document.querySelector('#items');document.querySelector('#toggle').onclick=()=>library.classList.toggle('open');function show(i){active=i;tabs.innerHTML='';cats.forEach((c,j)=>{let b=document.createElement('button');b.textContent=c.n;b.className=j===i?'active':'';b.onclick=()=>show(j);tabs.append(b)});items.innerHTML='';const c=cats[i];if(!c.files.length){items.textContent='تُستكمل صور الإنارة من مكتبة FurniPlan الأصلية.';return}c.files.forEach(f=>{let d=document.createElement('div'),im=document.createElement('img');im.src=f.startsWith('../')?f:'assets/'+f;im.alt=c.n;d.append(im);let label=document.createElement('small');label.textContent=c.n+' '+(items.children.length+1);d.append(label);items.append(d)})}show(0);
const frame=document.querySelector('#app');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;d.title='ElectricalPlan | كهرباء Electric';const style=d.createElement('style');style.textContent='[id*="sewerPlannerPanel"],[class*="sewerPlannerPanel"],[id*="pipeBuilder"],[class*="pipeBuilder"]{display:none!important}#sewerInterfacePanel .modernSliderBox{width:110px!important;min-width:110px!important;grid-template-columns:65px 30px!important;padding:2px!important}#sewerInterfacePanel .modernSliderBox input{width:65px!important;max-width:65px!important}#sewerInterfacePanel{max-width:245px!important}#sewerRibbonHeader #sewerModeDock{max-width:72px!important}#sewerRibbonHeader #sewerModeDock button{font-size:11px!important;min-width:55px!important;width:55px!important}';d.head.append(style);const installTitle=()=>{d.querySelector('#electricalToolbarTitle')?.remove();d.querySelectorAll('#sewerRibbonHeader,#sewerPrimaryScroll,#modernTopToolbar').forEach(el=>{if(el.id==='sewerPrimaryScroll'||el.id==='modernTopToolbar')return;el.querySelectorAll('*').forEach(n=>{if(n.children.length===0&&/SewerPlan/i.test(n.textContent||''))n.textContent=n.textContent.replace(/SewerPlan/gi,'ElectricalPlan')})})};installTitle();setInterval(installTitle,1800);const rewrite=()=>{d.querySelectorAll('body *').forEach(el=>{if(el.children.length===0){const t=(el.textContent||'').trim();if((/خارطة/.test(t)&&/Sewer/.test(t))||(/^Sewer$/.test(t))){el.style.setProperty('display','none','important');el.setAttribute('data-electrical-hidden','1')}}});d.querySelectorAll('body *').forEach(el=>{if(el.children.length===0&&el.textContent&&/SewerPlan|خارطة\s*Sewer|خارطة\s*المجاري|SMART DRAINAGE|DRAINAGE ROUTING|ارسم التمديدات والعكوس تلقائياً/i.test(el.textContent)){el.textContent=el.textContent.replace(/SewerPlan/gi,'ElectricalPlan').replace(/خارطة\s*Sewer|خارطة\s*المجاري/g,'كهرباء Electric').replace(/SMART DRAINAGE(?: ROUTING| PLANNING)?/gi,'SMART ELECTRICAL PLANNING').replace(/ارسم التمديدات والعكوس تلقائياً/g,'تخطيط المسارات الكهربائية بدقة')}});d.querySelectorAll('button').forEach(el=>{const t=(el.textContent||'').trim();if(/إنشاء (الأنابيب|أنبوب)|رسم (الأنابيب|أنبوب)|Create Pipe/i.test(t))el.style.display='none'})};rewrite();new MutationObserver(()=>{if(!window.__electricalPending){window.__electricalPending=true;requestAnimationFrame(()=>{window.__electricalPending=false;rewrite()})}}).observe(d.body,{childList:true,subtree:true})}catch(e){}});</script></body></html>
