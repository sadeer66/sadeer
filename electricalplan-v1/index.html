<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1a2c"><title>كهرباء Electric — ElectricalPlan</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px Tahoma,Arial;background:#101d30;color:#f3f4f6}button,input{font:inherit}button{cursor:pointer}#app{display:flex;flex-direction:column;height:100dvh}header{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:#081324;padding:6px;min-height:49px}#fixed{display:flex;flex:0 0 144px;flex-direction:column;gap:2px;border:1px solid #516178;border-radius:9px;padding:4px 5px;background:#17273d}#fixed label{display:grid;grid-template-columns:33px 1fr 28px;align-items:center;gap:3px;font-size:9px;white-space:nowrap}#fixed input{width:100%;height:12px;accent-color:#d49a37;min-width:0}#fixed output{font-size:9px;text-align:center}#ribbon{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:thin;min-width:0;flex:1;touch-action:pan-x}#brand{display:inline-flex;gap:2px;white-space:nowrap;flex:0 0 auto;font-weight:bold;font-size:12px;padding:5px 7px;border-left:1px solid #485b72}#brand b{color:#d29b42}#brand span{color:white}#ribbon button{flex:0 0 auto;min-width:54px;border:1px solid #4c5b6f;border-radius:8px;padding:7px 9px;background:#20344d;color:#fff;white-space:nowrap}#ribbon button.active{background:#b77c20;color:#111}#main{display:flex;flex:1;min-height:0;position:relative}#stage{flex:1;min-width:0;overflow:hidden;position:relative;background:#23354b;touch-action:none}#world{position:absolute;transform-origin:0 0;left:0;top:0;width:1200px;height:900px;background:#f3f2ee;background-image:linear-gradient(#d8dce1 1px,transparent 1px),linear-gradient(90deg,#d8dce1 1px,transparent 1px);background-size:25px 25px;box-shadow:0 4px 35px #0007}#plan{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}#objects{position:absolute;inset:0;overflow:visible;pointer-events:none}#objects .item{pointer-events:all;cursor:grab}#objects .selected{outline:2px dashed #c58c24;outline-offset:3px}#sidebar{width:250px;max-width:48vw;flex:0 0 auto;background:#132238;border-left:1px solid #516178;display:flex;flex-direction:column;min-height:0}#categories{display:flex;flex-wrap:wrap;gap:4px;padding:7px;border-bottom:1px solid #3c4d63}#categories button{background:#273b52;color:white;border:1px solid #53657b;border-radius:7px;padding:6px;font-size:11px}#categories button.active{background:#c58d30;color:#111}#catalog{overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:7px;align-content:start}#catalog button{min-width:0;background:#eef1f4;border:1px solid #8d9cad;border-radius:8px;padding:5px;color:#192639;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px}#catalog img{height:72px;width:100%;object-fit:contain}#status{padding:5px 10px;background:#091626;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e5c384}#file{display:none}#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#15243cee;border:1px solid #c58d30;border-radius:10px;padding:8px 12px;pointer-events:none;display:none;z-index:8}#libraryToggle{display:none}@media(max-width:700px){#sidebar{position:absolute;left:0;top:0;bottom:0;width:min(260px,65vw);max-width:none;z-index:5;transform:translateX(-100%);transition:transform .2s}#sidebar.open{transform:translateX(0)}#libraryToggle{display:block;position:absolute;left:10px;bottom:12px;z-index:6;background:#d49a37;border:0;border-radius:9px;padding:10px;color:#111;font-weight:bold}#brand{font-size:11px}header{gap:3px;padding:4px}#fixed{flex-basis:128px;padding:3px}#fixed label{grid-template-columns:30px 1fr 25px;font-size:8px}} </style></head><body><div id="app"><header><div id="fixed"><label>أيقونة <input id="size" type="range" min="20" max="130" value="55"><output id="sizeOut">55</output></label><label>كتابة <input id="labels" type="range" min="8" max="24" value="11"><output id="labelsOut">11</output></label></div><nav id="ribbon"><div id="brand"><b>كهرباء</b><span>Electric</span></div><button id="open">فتح خارطة</button><button id="new">جديد</button><button id="save">حفظ مشروع</button><button id="load">استعادة</button><button id="wire">رسم أسلاك</button><button id="move" class="active">تحريك</button><button id="calibrate">معايرة</button><button id="rotate">تدوير القطعة</button><button id="remove">حذف القطعة</button><button id="zoomIn">تكبير +</button><button id="zoomOut">تصغير −</button><button id="reset">ملاءمة</button></nav></header><div id="main"><section id="stage"><div id="world"><img id="plan" alt=""><svg id="objects" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg"></svg></div><div id="toast"></div><button id="libraryToggle">⚡ المكتبة</button></section><aside id="sidebar"><div id="categories"></div><div id="catalog"></div></aside></div><div id="status">ElectricalPlan — افتح خارطة ثم اختر قطعة من المكتبة لوضعها على المخطط</div></div><input type="file" id="file" accept="image/*,.json,application/json"><script>
'use strict';
const $=id=>document.getElementById(id),W=1200,H=900;
const groups=[
 {name:'الإنارة',files:Array.from({length:13},(_,i)=>'../../assets/v196/lighting/'+String(i+1).padStart(2,'0')+'.webp')},
 {name:'التبريد',files:Array.from({length:10},(_,i)=>'../../assets/v181/cooling_'+String(i+1).padStart(2,'0')+'.webp')},
 {name:'الأجهزة الكهربائية',files:['assets/v174/أجهزة كهربائية/aran0249.webp','assets/v174/أجهزة كهربائية/mpby8642.webp','assets/important/booster.png','assets/important/heater.webp','assets/important/pump.png','assets/important/purifier.png']},
 {name:'المطبخ',files:Array.from({length:15},(_,i)=>'../../assets/v179/kitchen_'+String(i+1).padStart(2,'0')+'.webp')}
];
let objects=[],wires=[],selected=null,category=0,tool='move',placing=null,scale=.6,tx=0,ty=0,drag=null,wireStart=null,calPoints=[],metresPerPixel=null,planData='';
const stage=$('stage'),world=$('world'),svg=$('objects');
function note(s){$('status').textContent=s;$('toast').textContent=s;$('toast').style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>$('toast').style.display='none',2500)}
function coords(e){let r=stage.getBoundingClientRect();return{x:(e.clientX-r.left-tx)/scale,y:(e.clientY-r.top-ty)/scale}}
function fit(){let r=stage.getBoundingClientRect();scale=Math.min(r.width/W,r.height/H)*.96;tx=(r.width-W*scale)/2;ty=(r.height-H*scale)/2;transform()}
function transform(){world.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'}
function render(){svg.replaceChildren();const ns='http://www.w3.org/2000/svg';for(let wire of wires){let l=document.createElementNS(ns,'line');for(let [k,v] of Object.entries({x1:wire.x1,y1:wire.y1,x2:wire.x2,y2:wire.y2,stroke:'#df7c1a','stroke-width':4,'stroke-linecap':'round'}))l.setAttribute(k,v);svg.append(l)}for(let o of objects){let im=document.createElementNS(ns,'image');let size=o.size||55;im.setAttribute('href',o.src);im.setAttribute('x',o.x-size/2);im.setAttribute('y',o.y-size/2);im.setAttribute('width',size);im.setAttribute('height',size);im.setAttribute('transform','rotate('+(o.rot||0)+' '+o.x+' '+o.y+')');im.dataset.id=o.id;im.setAttribute('class','item'+(selected===o.id?' selected':''));svg.append(im);if(o.label){let t=document.createElementNS(ns,'text');t.textContent=o.label;t.setAttribute('x',o.x);t.setAttribute('y',o.y+size/2+14);t.setAttribute('font-size',$('labels').value);t.setAttribute('text-anchor','middle');t.setAttribute('fill','#111');svg.append(t)}}}
function catalog(){let cats=$('categories');cats.replaceChildren();groups.forEach((g,i)=>{let b=document.createElement('button');b.textContent=g.name;b.className=i===category?'active':'';b.onclick=()=>{category=i;catalog()};cats.append(b)});let c=$('catalog');c.replaceChildren();groups[category].files.forEach((src,i)=>{let b=document.createElement('button'),img=document.createElement('img'),t=document.createElement('span');img.src=src;img.loading='lazy';img.onerror=()=>{img.style.opacity='.25'};t.textContent=groups[category].name+' '+(i+1);b.append(img,t);b.onclick=()=>{placing={src,label:t.textContent};tool='place';$('sidebar').classList.remove('open');note('المس الخارطة لإدراج '+t.textContent)};c.append(b)})}
stage.addEventListener('pointerdown',e=>{if(e.target.id==='libraryToggle')return;let p=coords(e);let id=e.target.dataset?.id;if(tool==='place'&&placing){let o={id:Date.now()+Math.random(),x:p.x,y:p.y,src:placing.src,size:Number($('size').value),rot:0,label:placing.label};objects.push(o);selected=o.id;render();note('تم إدراج '+o.label);return}if(tool==='wire'){if(!wireStart){wireStart=p;note('حدد نهاية السلك')}else{wires.push({x1:wireStart.x,y1:wireStart.y,x2:p.x,y2:p.y});wireStart=p;render();note('تم رسم السلك — المس النقطة التالية أو اضغط تحريك لإنهاء المسار')}return}if(tool==='calibrate'){calPoints.push(p);if(calPoints.length===2){let dist=Math.hypot(p.x-calPoints[0].x,p.y-calPoints[0].y);let metres=prompt('المسافة الحقيقية بين النقطتين بالمتر؟','1');if(metres&&Number(metres)>0&&dist>0){metresPerPixel=Number(metres)/dist;note('تمت المعايرة: '+(1/metresPerPixel).toFixed(1)+' بكسل/متر')}calPoints=[]}else note('حدد النقطة الثانية للمعايرة');return}selected=id?Number(id):null;if(id){drag={type:'item',id:selected,start:p};render()}else{drag={type:'pan',x:e.clientX,y:e.clientY,tx,ty}}stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;if(drag.type==='pan'){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform()}else{let o=objects.find(o=>o.id===drag.id);if(o){let p=coords(e);o.x=p.x;o.y=p.y;render()}}});stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointercancel',()=>drag=null);
function mode(t){tool=t;placing=null;wireStart=null;document.querySelectorAll('#ribbon button').forEach(b=>b.classList.toggle('active',b.id===t));note(t==='wire'?'المس بداية السلك ثم نهايته':t==='calibrate'?'حدد نقطتين معلومتي المسافة':'وضع التحريك')}
$('wire').onclick=()=>mode('wire');$('move').onclick=()=>mode('move');$('calibrate').onclick=()=>{calPoints=[];mode('calibrate')};
$('size').oninput=()=>{$('sizeOut').textContent=$('size').value;if(selected){let o=objects.find(o=>o.id===selected);if(o)o.size=Number($('size').value);render()}};$('labels').oninput=()=>{$('labelsOut').textContent=$('labels').value;render()};
$('rotate').onclick=()=>{let o=objects.find(o=>o.id===selected);if(o){o.rot=(o.rot+45)%360;render()}else note('اختر قطعة أولاً')};
$('remove').onclick=()=>{if(selected){objects=objects.filter(o=>o.id!==selected);selected=null;render()}else note('اختر قطعة لحذفها')};
function zoom(f){let r=stage.getBoundingClientRect(),cx=r.width/2,cy=r.height/2;tx=cx-(cx-tx)*f;ty=cy-(cy-ty)*f;scale*=f;transform()}
$('zoomIn').onclick=()=>zoom(1.2);$('zoomOut').onclick=()=>zoom(1/1.2);$('reset').onclick=fit;
$('libraryToggle').onclick=()=>$('sidebar').classList.toggle('open');
$('new').onclick=()=>{if(confirm('بدء مشروع جديد؟')){objects=[];wires=[];selected=null;planData='';$('plan').removeAttribute('src');metresPerPixel=null;render();fit()}};
$('open').onclick=()=>{$('file').accept='image/*';$('file').click()};$('load').onclick=()=>{$('file').accept='.json,application/json';$('file').click()};
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.type.startsWith('image/')){planData=await new Promise((resolve,reject)=>{let rd=new FileReader;rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)});$('plan').src=planData;note('تم فتح الخارطة')}else{let j=JSON.parse(await f.text());if(j.format!=='ElectricalPlan-1')throw Error('ملف غير متوافق');objects=j.objects||[];wires=j.wires||[];planData=j.plan||'';metresPerPixel=j.metresPerPixel||null;$('plan').src=planData;selected=null;render();fit();note('تم استعادة المشروع')}}catch(err){note('تعذر فتح الملف: '+err.message)}e.target.value=''};
$('save').onclick=()=>{let data=JSON.stringify({format:'ElectricalPlan-1',objects,wires,plan:planData,metresPerPixel},null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ElectricalPlan-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);note('تم تجهيز ملف المشروع')};
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.08:1/1.08)},{passive:false});
window.addEventListener('resize',fit);catalog();fit();render();
</script></body></html>
