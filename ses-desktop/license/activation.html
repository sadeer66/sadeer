</style><main><img id="logo" alt="SES"><h1>تفعيل استوديو سدير الهندسي</h1><p id="intro">أرسل رمز جهازك أو ملف طلب التفعيل إلى البائع، ثم استورد ملف الترخيص الذي يصلك. بعد التفعيل يعمل SES دون إنترنت.</p><code id="device">جارٍ قراءة رمز الجهاز…</code><div><button class="secondary" id="copy">نسخ الرمز</button><button class="secondary" id="request">حفظ طلب التفعيل</button></div><button id="import">استيراد ملف الترخيص</button><button id="continue" hidden>فتح SES</button><p id="status" role="status"></p><small>الترخيص مرتبط بتثبيت Windows على هذا الجهاز. إعادة تثبيت Windows قد تتطلب تفعيلًا جديدًا.</small></main><script src="activation.js"></script></html>
