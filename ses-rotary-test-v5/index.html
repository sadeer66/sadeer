<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SES Rotary Test</title><style>body{margin:0;font-family:Arial;background:#fff;color:#173a55}header{padding:15px;background:#173a55;color:white}main{height:90vh;background-image:linear-gradient(#e6edf4 1px,transparent 1px),linear-gradient(90deg,#e6edf4 1px,transparent 1px);background-size:30px 30px;position:relative}.stack{position:absolute;right:10px;top:30px;display:grid;gap:65px}.group{position:relative;width:190px;text-align:center}.wheel{width:190px;height:190px;border:2px solid #3479b2;border-radius:50%;background:transparent;position:relative;touch-action:none;user-select:none;cursor:grab}.item{position:absolute;top:0;left:50%;transform-origin:0 95px;font-size:13px;font-weight:bold;white-space:nowrap;pointer-events:none}.zero{color:#dc4837;font-weight:bold}.controls button{padding:9px;margin:5px;border:0;border-radius:8px;background:#275c83;color:white}.label{background:#ffffffc9;padding:5px}.note{position:absolute;left:10px;top:20px;max-width:42%;font-size:13px;background:#ffffffd9;padding:10px;border-radius:8px}</style><header><b>SES — اختبار القرصين الدوّارين</b></header><main><div class="note">اسحب القرص باللمس أو الماوس. عند تركه يثبت أقرب خيار على نقطة الصفر ▲. الأسهم بديل للدوران.</div><div class="stack"><div class="group"><div class="label">الخيارات <span class="zero">▲ صفر</span></div><div class="wheel" id="a"></div><div class="controls"><button onclick="step('a',-1)">◀</button><button onclick="step('a',1)">▶</button></div><div id="ta"></div></div><div class="group"><div class="label">محتويات الخيار <span class="zero">▲ صفر</span></div><div class="wheel" id="b"></div><div class="controls"><button onclick="step('b',-1)">◀</button><button onclick="step('b',1)">▶</button></div><div id="tb"></div></div></div></main><script>const categories=['أنابيب','أكواع','وصلات','مصارف','مناهل','أدوات'];const sets=[['أنبوب 110','أنبوب 75','أنبوب 50','أنبوب 40','أنبوب 32','أنبوب 25'],['كوع 90','كوع 45','كوع 30','كوع 15','كوع مزدوج','كوع طويل'],['وصلة T','وصلة Y','صليب','جلبة','مخفض','غطاء'],['مصرف أرضي','مصرف مطبخ','سيفون','شبك','مصرف خطي','مصرف حمام'],['منهول','غطاء','تفتيش','دائري','مربع','كبير'],['تحديد','تحريك','قياس','نسخ','تدوير','حذف']];const state={a:{angle:0,items:categories},b:{angle:0,items:sets[0]}};function index(id){let s=state[id];return ((Math.round(-s.angle/60)%6)+6)%6}function draw(id){let s=state[id],w=document.getElementById(id);w.innerHTML='';s.items.forEach((t,i)=>{let el=document.createElement('div');el.className='item';el.style.transform='rotate('+(i*60+s.angle)+'deg) translateY(-1px)';let txt=document.createElement('span');txt.textContent=t;txt.style.display='inline-block';txt.style.transform='translate(-50%,8px) rotate('+(-i*60-s.angle)+'deg)';el.appendChild(txt);w.appendChild(el)});document.getElementById('t'+id).textContent=s.items[index(id)]}function change(id){draw(id);if(id==='a'){state.b.items=sets[index('a')];state.b.angle=0;draw('b')}}function step(id,dir){state[id].angle-=dir*60;change(id)}function init(id){let w=document.getElementById(id),start=null,initial=0;function angle(e){let r=w.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI}w.addEventListener('pointerdown',e=>{start=angle(e);initial=state[id].angle;w.setPointerCapture(e.pointerId);e.preventDefault()});w.addEventListener('pointermove',e=>{if(start===null)return;let d=angle(e)-start;if(d>180)d-=360;if(d< -180)d+=360;state[id].angle=initial+d;draw(id)});function end(){if(start===null)return;start=null;state[id].angle=Math.round(state[id].angle/60)*60;change(id)}w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);draw(id)}init('a');init('b');</script></html>
