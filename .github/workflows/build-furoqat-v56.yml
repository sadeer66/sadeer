name: Build Furoqat V56 Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'furoqat/**'
      - 'furoqat-desktop/**'
      - '.github/workflows/build-furoqat-v56.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: furoqat-desktop/package.json

      - name: Install dependencies
        working-directory: furoqat-desktop
        run: npm install

      - name: Build Windows installer
        working-directory: furoqat-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: Furoqat-V56-Windows-EXE
          path: furoqat-desktop/dist/*.exe
          if-no-files-found: error
