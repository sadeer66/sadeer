name: Build Wasoolat V20 Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'wasoolat/**'
      - '.github/workflows/wasoolat-desktop.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        shell: pwsh
        working-directory: wasoolat
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        shell: pwsh
        working-directory: wasoolat
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wasoolat-V20-Windows-Installer
          path: wasoolat/dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish Wasoolat V20 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Wasoolat-V20
          name: برنامج الوصولات V20
          body: |
            النسخة النهائية المعتمدة V20.
            نفس أيقونة برنامج الوصولات في التثبيت واختصار سطح المكتب ونسخة iPhone/iPad.
          files: wasoolat/dist/*.exe
          make_latest: true
