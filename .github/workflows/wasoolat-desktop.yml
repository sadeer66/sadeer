name: Build Wasoolat V24 Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'wasoolat/**'
      - '.github/workflows/wasoolat-desktop.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        shell: pwsh
        working-directory: wasoolat
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        shell: pwsh
        working-directory: wasoolat
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Create V24 archive ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wasoolat-save | Out-Null
          Copy-Item wasoolat/index.html wasoolat-save/Wasoolat-V24-Save.html -Force
          Compress-Archive -Path wasoolat-save/* -DestinationPath Wasoolat-V24-Save.zip -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wasoolat-V24-Windows-Installer
          path: wasoolat/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload save archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wasoolat-V24-Save
          path: Wasoolat-V24-Save.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish Wasoolat V24 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Wasoolat-V24
          name: الوصولات V24
          body: |
            النسخة النهائية المعتمدة V24.
            نفس أيقونة الوصولات في التثبيت واختصار سطح المكتب ونسخة iPhone/iPad.
          files: |
            wasoolat/dist/*.exe
            Wasoolat-V24-Save.zip
          make_latest: true
