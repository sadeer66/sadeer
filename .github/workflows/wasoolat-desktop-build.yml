name: Build Wasoolat Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare application files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wasoolat-desktop/app | Out-Null
          New-Item -ItemType Directory -Force -Path wasoolat-desktop/build | Out-Null

          Copy-Item wasoolat/index.html wasoolat-desktop/app/index.html -Force
          Copy-Item wasoolat/manifest.webmanifest wasoolat-desktop/app/manifest.webmanifest -Force
          Copy-Item wasoolat/apple-touch-icon.png wasoolat-desktop/app/apple-touch-icon.png -Force

      - name: Create clean Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image, ImageDraw, ImageFont

          size = 512
          img = Image.new("RGB", (size, size), (8, 59, 89))
          px = img.load()

          c1 = (8, 59, 89)
          c2 = (17, 181, 206)

          for y in range(size):
              for x in range(size):
                  t = (x + y) / (2 * (size - 1))
                  px[x, y] = tuple(
                      int(c1[i] * (1 - t) + c2[i] * t)
                      for i in range(3)
                  )

          draw = ImageDraw.Draw(img)

          # White rounded border
          margin = 28
          draw.rounded_rectangle(
              [margin, margin, size - margin, size - margin],
              radius = 105,
              outline = (255, 255, 255),
              width = 10
          )

          # Arabic letter Waw
          font = ImageFont.truetype(
              r"C:\Windows\Fonts\arialbd.ttf",
              300
          )

          text = "و"
          box = draw.textbbox((0, 0), text, font=font)
          w = box[2] - box[0]
          h = box[3] - box[1]

          draw.text(
              ((size - w) / 2 - box[0],
               (size - h) / 2 - box[1] - 10),
              text,
              font=font,
              fill=(255,255,255)
          )

          img.save("wasoolat-desktop/app/icon-512.png")

          img.save(
              "wasoolat-desktop/build/icon.ico",
              format="ICO",
              sizes=[
                  (16,16),
                  (24,24),
                  (32,32),
                  (48,48),
                  (64,64),
                  (128,128),
                  (256,256)
              ]
          )
          '@ | Set-Content -Path create_icon.py -Encoding UTF8

          python create_icon.py

      - name: Validate Windows icon
        shell: pwsh
        run: |
          if (!(Test-Path wasoolat-desktop/build/icon.ico)) {
            throw "icon.ico was not created"
          }

          $size = (Get-Item wasoolat-desktop/build/icon.ico).Length

          if ($size -lt 1000) {
            throw "icon.ico is too small or invalid"
          }

          Write-Host "Windows icon created successfully: $size bytes"

      - name: Install dependencies
        shell: pwsh
        working-directory: wasoolat-desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        shell: pwsh
        working-directory: wasoolat-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem wasoolat-desktop/dist -Filter *.exe -Recurse

          if (!$files) {
            throw "No Windows installer was created"
          }

          $files | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Wasoolat-Windows-Installer-V1.1
          path: wasoolat-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
