name: Build Wasoolat Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/wasoolat-desktop-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wasoolat-desktop/app | Out-Null
          Copy-Item wasoolat/index.html wasoolat-desktop/app/index.html
          Copy-Item wasoolat/manifest.webmanifest wasoolat-desktop/app/manifest.webmanifest
          Copy-Item wasoolat/apple-touch-icon.png wasoolat-desktop/app/apple-touch-icon.png
          New-Item -ItemType Directory -Force -Path wasoolat-desktop/build | Out-Null

      - name: Create Windows icon
        shell: pwsh
        run: |
          python -m pip install pillow
          python -c "from PIL import Image; im=Image.open('wasoolat/apple-touch-icon.png').convert('RGBA'); im=im.resize((256,256),Image.Resampling.LANCZOS); im.save('wasoolat-desktop/build/icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Install dependencies
        shell: pwsh
        working-directory: wasoolat-desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        shell: pwsh
        working-directory: wasoolat-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Wasoolat-Windows-Installer
          path: wasoolat-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
