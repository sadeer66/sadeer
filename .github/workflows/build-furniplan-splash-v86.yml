name: Build FurniPlan V86 Splash

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/scripts/build_furniplan_splash_v86.py'
      - '.github/workflows/build-furniplan-splash-v86.yml'

permissions:
  contents: write

jobs:
  build-splash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          python -m pip install --disable-pip-version-check pillow

      - name: Decode original splash
        run: dwebp assets/furniplan-splash-v74.webp -o /tmp/furniplan-splash-source.png

      - name: Build HQ splash
        run: python .github/scripts/build_furniplan_splash_v86.py

      - name: Commit HQ splash
        shell: bash
        run: |
          git config user.name "OpenAI FurniPlan Builder"
          git config user.email "actions@users.noreply.github.com"
          git add assets/furniplan-splash-hq-v86.png
          if git diff --cached --quiet; then
            echo "No splash change"
            exit 0
          fi
          git commit -m "Add FurniPlan V86 high-resolution splash"
          git pull --rebase origin master
          git push origin master
