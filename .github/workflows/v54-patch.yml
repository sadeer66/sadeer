name: Patch Taatheethi V57 Doors and Windows

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v54-patch.yml'

permissions:
  contents: write

jobs:
  patch-v57:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V57 patch
        run: python .github/scripts/apply_v57.py

      - name: Commit V57
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Taatheethi V57: colorful door and window icons + iPad dining fix"
            git push
          fi

# retry-v57-4
