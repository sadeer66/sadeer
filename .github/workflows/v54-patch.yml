name: Patch Taatheethi V54 Toolbar

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/v54-patch.yml'

permissions:
  contents: write

jobs:
  patch-v54:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V54 toolbar patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          c = p.read_text(encoding="utf-8")

          def replace_one(old, new, label):
              global c
              n = c.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {n}")
              c = c.replace(old, new, 1)

          if "function openExportDialog()" not in c:
              anchor = "\ndocument.getElementById('exportBtn').onclick=openExportDialog;"
              fn = """
          function openExportDialog(){
            pngProjectName.value=projectMeta.name||'مشروع جديد';
            pngMapTitle.value=projectMeta.mapTitle||'';
            pngClient.value=projectMeta.client||'';
            pngLocation.value=projectMeta.location||'';
            exportModal.style.display='flex';
          }"""
              replace_one(anchor, "\n" + fn + anchor, "openExportDialog")

          if "measureLine:svg(" not in c:
              old = """    dims:svg('<path d="M5 7v10M19 7v10M5 12h14"/><path d="m8 9-3 3 3 3M16 9l3 3-3 3"/>'),"""
              new = old + """
              measureLine:svg('<path d="M4 12h16"/><path d="m7 9-3 3 3 3M17 9l3 3-3 3"/><circle cx="12" cy="12" r="1.4"/>'),
              chair:svg('<path d="M7 12h10a2 2 0 0 1 2 2v3H5v-3a2 2 0 0 1 2-2Z"/><path d="M7 12V8a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v4M7 17v3M17 17v3"/>'),
              map:svg('<path d="m4 6 5-2 6 2 5-2v14l-5 2-6-2-5 2Z"/><path d="M9 4v14M15 6v14"/>'),"""
              replace_one(old, new, "toolbar icons")

          if "button('v54MeasureLine'" not in c:
              grid = """    [
                button('v44Grid','grid','الشبكة',()=>toggle('gridToggle'),'secondaryTop','شبكة'),"""
              rows = """    [
                button('v54MeasureLine','measureLine','إخفاء / إظهار خط القياس مع إبقاء الرقم',()=>toggle('measureArrowsToggle'),'','خط القياس'),
                button('v54Measures','dims','إخفاء / إظهار جميع القياسات',()=>toggle('measureLayerToggle'),'','القياسات'),
                button('v54Labels','tag','إخفاء / إظهار المسميات',()=>toggle('mapLabelLayerToggle'),'','المسميات'),
                button('v54Map','map','إخفاء / إظهار الخارطة',()=>toggle('bgLayerToggle'),'','الخارطة'),
                button('v54Furniture','chair','إخفاء / إظهار الأثاث',()=>toggle('furnitureLayerToggle'),'','الأثاث')
              ],
              [
                button('v54LockLabels','lock','قفل / فتح المسميات',()=>toggle('mapLabelLockToggle'),'','قفل مسميات'),
                button('v54LockMeasures','lock','قفل / فتح القياسات',()=>toggle('measureLockToggle'),'','قفل قياسات')
              ],
          """ + grid
              replace_one(grid, rows, "toolbar rows")

          old_map = """  const checkMap={v44Grid:'gridToggle',lMulti:'multiSelectToggle',lDims:'dimsToggle',lNames:'labelsToggle',lSnap:'snapToggle',lAuto:'autoDimsToggle',lShadow:'shadowToggle',lSummary:'furnitureSummaryToggle'};"""
          if old_map in c:
              new_map = """  const checkMap={
              v44Grid:'gridToggle',
              v54MeasureLine:'measureArrowsToggle',v54Measures:'measureLayerToggle',v54Labels:'mapLabelLayerToggle',v54Map:'bgLayerToggle',v54Furniture:'furnitureLayerToggle',
              v54LockLabels:'mapLabelLockToggle',v54LockMeasures:'measureLockToggle',
              lMulti:'multiSelectToggle',lDims:'dimsToggle',lNames:'labelsToggle',lSnap:'snapToggle',lAuto:'autoDimsToggle',lShadow:'shadowToggle',lSummary:'furnitureSummaryToggle'
            };"""
              replace_one(old_map, new_map, "checkMap")

          if "setToolLabel('v54MeasureLine'" not in c:
              anchor = """    Object.entries(checkMap).forEach(([bid,cid])=>{const b=document.getElementById(bid),c=document.getElementById(cid);if(b&&c)b.classList.toggle('active',!!c.checked);});"""
              block = anchor + """
              const setToolLabel=(id,text)=>{const b=document.getElementById(id),sp=b?.querySelector('.iconLabel');if(sp){sp.textContent=text;sp.classList.toggle('short',String(text).length>7);}};
              const stateLabel=(cid,onText,offText)=>document.getElementById(cid)?.checked?onText:offText;
              setToolLabel('v54MeasureLine',stateLabel('measureArrowsToggle','إخفاء خط','إظهار خط'));
              setToolLabel('v54Measures',stateLabel('measureLayerToggle','إخفاء قياسات','إظهار قياسات'));
              setToolLabel('v54Labels',stateLabel('mapLabelLayerToggle','إخفاء مسميات','إظهار مسميات'));
              setToolLabel('v54Map',stateLabel('bgLayerToggle','إخفاء خارطة','إظهار خارطة'));
              setToolLabel('v54Furniture',stateLabel('furnitureLayerToggle','إخفاء أثاث','إظهار أثاث'));
              setToolLabel('v54LockLabels',stateLabel('mapLabelLockToggle','فتح مسميات','قفل مسميات'));
              setToolLabel('v54LockMeasures',stateLabel('measureLockToggle','فتح قياسات','قفل قياسات'));"""
              replace_one(anchor, block, "state labels")

          old_listener = """  ['gridToggle','multiSelectToggle','dimsToggle','labelsToggle','snapToggle','autoDimsToggle','shadowToggle','furnitureSummaryToggle'].forEach(id=>document.getElementById(id)?.addEventListener('change',syncStates));"""
          if old_listener in c:
              new_listener = """  ['gridToggle','measureArrowsToggle','measureLayerToggle','mapLabelLayerToggle','bgLayerToggle','furnitureLayerToggle','mapLabelLockToggle','measureLockToggle','multiSelectToggle','dimsToggle','labelsToggle','snapToggle','autoDimsToggle','shadowToggle','furnitureSummaryToggle'].forEach(id=>document.getElementById(id)?.addEventListener('change',syncStates));"""
              replace_one(old_listener, new_listener, "listeners")

          required = [
              "function openExportDialog()",
              "button('v54MeasureLine'",
              "button('v54Measures'",
              "button('v54Labels'",
              "button('v54Map'",
              "button('v54Furniture'",
              "button('v54LockLabels'",
              "button('v54LockMeasures'",
              "setToolLabel('v54MeasureLine'"
          ]
          missing = [x for x in required if x not in c]
          if missing:
              raise SystemExit("Verification failed: " + ", ".join(missing))

          p.write_text(c, encoding="utf-8")

          Path("service-worker.js").write_text("""const CACHE_NAME = "taatheethi-v54-restored-display-locks";

          self.addEventListener('install', event => {
            self.skipWaiting();
          });

          self.addEventListener('activate', event => {
            event.waitUntil(
              caches.keys()
                .then(keys => Promise.all(keys.map(k => caches.delete(k))))
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', event => {
            if (event.request.method !== 'GET') return;
            event.respondWith(fetch(event.request, {cache:'no-store'}));
          });
          """, encoding="utf-8")
          PY

      - name: Commit V54
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Taatheethi V54: restore display and lock toolbar controls"
            git push
          fi
