name: Validate Taatheethi V62 Index

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/validate-index-v61.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract inline scripts
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib
          c=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=[m.group(1) for m in re.finditer(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',c,re.I) if m.group(1).strip()]
          print('scripts',len(scripts))
          for i,s in enumerate(scripts):
              pathlib.Path(f'/tmp/inline_{i}.js').write_text(s,encoding='utf-8')
              print(i,len(s))
          PY
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in /tmp/inline_*.js; do
            echo "Checking $f"
            node --check "$f"
          done

