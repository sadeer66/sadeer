name: FurniPlan V233 approved release
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['furniplan-v233/**', 'desktop-v233/**', '.github/workflows/release-v233.yml']
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y nsis
      - name: Download Electron runtime
        run: curl -fL --retry 3 https://github.com/electron/electron/releases/download/v44.4.5/electron-v44.4.5-win32-x64.zip -o /tmp/electron.zip
      - name: Build installer
        run: python3 desktop-v233/build.py
      - name: Publish approved release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr FurniPlan-V233-Web.zip furniplan-v233
          sha256sum FurniPlan-V233-Setup.exe FurniPlan-V233-Web.zip > SHA256-V233.txt
          gh release view v233 >/dev/null 2>&1 || gh release create v233 --title 'FurniPlan V233' --notes 'Approved FurniPlan V233. Windows installer opens maximized. Mobile web: https://sadeer66.github.io/sadeer/furniplan-v233/'
          gh release upload v233 FurniPlan-V233-Setup.exe FurniPlan-V233-Web.zip SHA256-V233.txt --clobber
