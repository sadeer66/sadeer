name: SES Windows offline activation
on:
  push:
    branches: ['development/ses-desktop-activation']
    paths: ['ses-desktop/**', '.github/workflows/ses-desktop-central.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ses-desktop-central-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ses-lab
            ses-desktop
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated programs and shared library
        run: |
          python ses-desktop/prepare.py ses-desktop/Web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ses-desktop/prepare.py ses-desktop/Web --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ses-desktop/test-server.cjs ses-desktop/Web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item ses-lab/assets/icons/ses-v9.ico ses-desktop/icon.ico
          Copy-Item ses-desktop/Web/central-library-report.json ses-desktop/central-library-report.json
      - name: Verify licensing and prepare owner tool
        run: |
          Copy-Item ses-desktop/license/core.cjs ses-desktop/license-manager/core.cjs
          node ses-desktop/license/test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install desktop build dependencies
        working-directory: ses-desktop
        run: npm install --no-audit --no-fund
      - name: Open all four apps and test shared images and native state
        working-directory: ses-desktop
        run: npx electron . --smoke-test
      - name: Test and package owner license manager
        working-directory: ses-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron license-manager --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --projectDir license-manager --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check whether owner public key is configured
        id: ownerkey
        run: |
          $count = (Get-Content ses-desktop/license/public-keys.json | ConvertFrom-Json).keys.PSObject.Properties.Count
          if ($count -gt 0) { "configured=true" >> $env:GITHUB_OUTPUT } else { "configured=false" >> $env:GITHUB_OUTPUT }
      - name: Package protected customer installer
        if: steps.ownerkey.outputs.configured == 'true'
        working-directory: ses-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package -- --publish never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SES-Windows-Offline-Activation
          path: |
            ses-desktop/dist/*.exe
            ses-desktop/license-manager/dist/*.exe
            ses-desktop/central-library-report.json
            ses-desktop/package-lock.json
          if-no-files-found: error
          retention-days: 30
