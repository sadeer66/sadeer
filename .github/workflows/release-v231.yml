name: FurniPlan V231 approved release
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['furniplan-v231/**', 'desktop-v231/**', '.github/workflows/release-v231.yml']
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y nsis
      - name: Download Electron runtime
        run: curl -fL --retry 3 https://github.com/electron/electron/releases/download/v44.4.5/electron-v44.4.5-win32-x64.zip -o /tmp/electron.zip
      - name: Build installer
        run: python3 desktop-v231/build.py
      - name: Publish approved release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr FurniPlan-V231-Web.zip furniplan-v231
          sha256sum FurniPlan-V231-Setup.exe FurniPlan-V231-Web.zip > SHA256-V231.txt
          gh release view v231 >/dev/null 2>&1 || gh release create v231 --title 'FurniPlan V231' --notes 'Approved FurniPlan V231. Windows installer opens maximized. Mobile web: https://sadeer66.github.io/sadeer/furniplan-v231/'
          gh release upload v231 FurniPlan-V231-Setup.exe FurniPlan-V231-Web.zip SHA256-V231.txt --clobber
