name: Upload FurniPlan V195 to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/trigger-testflight.txt'

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          test -n "$IOS_CERTIFICATE_BASE64"
          test -n "$IOS_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install signing certificate and profile
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/FurniPlan_Distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/FurniPlan.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/furniplan-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Prepare FurniPlan V195 web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios/FurniPlan/Web
          mkdir -p ios/FurniPlan/Web
          cp index.html ios/FurniPlan/Web/
          cp v85-final-patch.js ios/FurniPlan/Web/
          cp library_v185.js ios/FurniPlan/Web/
          cp v186-ipad-memory-fix.js ios/FurniPlan/Web/
          cp v191-library-pager-safe.js ios/FurniPlan/Web/
          cp v195-ui-pan-patch.js ios/FurniPlan/Web/
          cp catalog.html ios/FurniPlan/Web/ || true
          cp assistant-auth.js ios/FurniPlan/Web/ || true
          cp assistant-auth.json ios/FurniPlan/Web/ || true
          cp assistant-link.js ios/FurniPlan/Web/ || true
          cp assistant.json ios/FurniPlan/Web/ || true
          cp manifest.webmanifest ios/FurniPlan/Web/ || true
          cp service-worker.js ios/FurniPlan/Web/ || true
          cp apple-touch-icon.png ios/FurniPlan/Web/ || true
          cp apple-touch-icon-120x120.png ios/FurniPlan/Web/ || true
          cp apple-touch-icon-152x152.png ios/FurniPlan/Web/ || true
          cp apple-touch-icon-167x167.png ios/FurniPlan/Web/ || true
          cp apple-touch-icon-180x180.png ios/FurniPlan/Web/ || true
          cp favicon.ico ios/FurniPlan/Web/ || true
          cp favicon-32.png ios/FurniPlan/Web/ || true
          cp v13-ipad-fix.js ios/FurniPlan/Web/ || true
          cp -R v174-assets ios/FurniPlan/Web/ || true
          cp -R assets ios/FurniPlan/Web/ || true
          cp -R icons ios/FurniPlan/Web/ || true
          find . -maxdepth 1 -type f \( -name 'v45p_*' -o -name 'v45t_*' \) -exec cp {} ios/FurniPlan/Web/ \;

      - name: Generate iOS app icons
        shell: bash
        run: |
          set -euo pipefail
          SRC="icons/icon-512.png"
          if [ ! -f "$SRC" ]; then SRC="apple-touch-icon.png"; fi
          DEST="ios/FurniPlan/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$DEST"
          sips -z 1024 1024 "$SRC" --out "$DEST/AppIcon-1024.png" >/dev/null
          sips -z 20 20 "$SRC" --out "$DEST/Icon-20.png" >/dev/null
          sips -z 29 29 "$SRC" --out "$DEST/Icon-29.png" >/dev/null
          sips -z 40 40 "$SRC" --out "$DEST/Icon-40.png" >/dev/null
          cp "$DEST/Icon-40.png" "$DEST/Icon-40-ipad.png"
          cp "$DEST/Icon-40.png" "$DEST/Icon-40-spot.png"
          sips -z 58 58 "$SRC" --out "$DEST/Icon-58.png" >/dev/null
          cp "$DEST/Icon-58.png" "$DEST/Icon-58-ipad.png"
          sips -z 60 60 "$SRC" --out "$DEST/Icon-60.png" >/dev/null
          sips -z 76 76 "$SRC" --out "$DEST/Icon-76.png" >/dev/null
          sips -z 80 80 "$SRC" --out "$DEST/Icon-80.png" >/dev/null
          cp "$DEST/Icon-80.png" "$DEST/Icon-80-ipad.png"
          sips -z 87 87 "$SRC" --out "$DEST/Icon-87.png" >/dev/null
          sips -z 120 120 "$SRC" --out "$DEST/Icon-120.png" >/dev/null
          cp "$DEST/Icon-120.png" "$DEST/Icon-120-home.png"
          sips -z 152 152 "$SRC" --out "$DEST/Icon-152.png" >/dev/null
          sips -z 167 167 "$SRC" --out "$DEST/Icon-167.png" >/dev/null
          sips -z 180 180 "$SRC" --out "$DEST/Icon-180.png" >/dev/null
          sips -z 1024 1024 "$SRC" --out "$DEST/Icon-1024.png" >/dev/null
          # Also place explicit legacy icon files in the app resource bundle for App Store validation.
          sips -z 120 120 "$SRC" --out "ios/FurniPlan/Resources/Icon-120.png" >/dev/null
          sips -z 180 180 "$SRC" --out "ios/FurniPlan/Resources/Icon-180.png" >/dev/null
          sips -z 76 76 "$SRC" --out "ios/FurniPlan/Resources/Icon-76.png" >/dev/null
          sips -z 152 152 "$SRC" --out "ios/FurniPlan/Resources/Icon-152.png" >/dev/null
          sips -z 167 167 "$SRC" --out "ios/FurniPlan/Resources/Icon-167.png" >/dev/null
          sips -z 120 120 "$SRC" --out "ios/FurniPlan/Resources/Icon-60@2x.png" >/dev/null
          sips -z 180 180 "$SRC" --out "ios/FurniPlan/Resources/Icon-60@3x.png" >/dev/null

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/FurniPlan
        run: xcodegen generate

      - name: Archive signed iPhone/iPad app
        working-directory: ios/FurniPlan
        shell: bash
        run: |
          set -o pipefail
          xcodebuild             -project FurniPlan.xcodeproj             -scheme FurniPlan             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$PWD/build/FurniPlan.xcarchive"             DEVELOPMENT_TEAM=RM95TH446W             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Distribution"             PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME"             archive | tee archive.log

      - name: Export IPA
        working-directory: ios/FurniPlan
        shell: bash
        run: |
          set -o pipefail
          cp ExportOptions.plist ExportOptions.generated.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.sadeer.furniplan $IOS_PROFILE_NAME" ExportOptions.generated.plist
          xcodebuild             -exportArchive             -archivePath "$PWD/build/FurniPlan.xcarchive"             -exportPath "$PWD/build/export"             -exportOptionsPlist ExportOptions.generated.plist             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"             | tee export.log

      - name: Verify exported IPA metadata
        working-directory: ios/FurniPlan
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$PWD/build/export" -name '*.ipa' -print -quit)
          test -n "$IPA"
          TMP="$RUNNER_TEMP/furniplan-ipa-check"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$IPA" -d "$TMP"
          APP=$(find "$TMP/Payload" -maxdepth 1 -name '*.app' -print -quit)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$APP/Info.plist"
          find "$APP" -maxdepth 1 -type f -name '*120*.png' -o -name '*152*.png' | sort || true
          test -f "$APP/Assets.car"

      - name: Upload IPA to TestFlight
        working-directory: ios/FurniPlan
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$PWD/build/export" -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app             --type ios             --file "$IPA"             --apiKey "$APP_STORE_CONNECT_KEY_ID"             --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FurniPlan-V195-AppStore-IPA
          path: ios/FurniPlan/build/export/*.ipa
          retention-days: 30

# manual signing trigger
