name: Upload FurniPlan V119 to TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare FurniPlan V119 web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios/FurniPlan/Web
          mkdir -p ios/FurniPlan/Web
          cp index.html ios/FurniPlan/Web/
          cp v85-final-patch.js ios/FurniPlan/Web/
          cp catalog.html ios/FurniPlan/Web/ || true
          cp assistant-auth.js ios/FurniPlan/Web/ || true
          cp assistant-auth.json ios/FurniPlan/Web/ || true
          cp assistant-link.js ios/FurniPlan/Web/ || true
          cp assistant.json ios/FurniPlan/Web/ || true
          cp manifest.webmanifest ios/FurniPlan/Web/ || true
          cp service-worker.js ios/FurniPlan/Web/ || true
          cp apple-touch-icon.png ios/FurniPlan/Web/ || true
          cp favicon-32.png ios/FurniPlan/Web/ || true
          cp v13-ipad-fix.js ios/FurniPlan/Web/ || true
          cp -R assets ios/FurniPlan/Web/ || true
          cp -R icons ios/FurniPlan/Web/ || true
          find . -maxdepth 1 -type f \( -name 'v45p_*' -o -name 'v45t_*' \) -exec cp {} ios/FurniPlan/Web/ \;

      - name: Generate iOS app icons
        shell: bash
        run: |
          set -euo pipefail
          SRC="icons/icon-512.png"
          if [ ! -f "$SRC" ]; then SRC="apple-touch-icon.png"; fi
          DEST="ios/FurniPlan/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$DEST"
          sips -z 20 20 "$SRC" --out "$DEST/Icon-20.png" >/dev/null
          sips -z 29 29 "$SRC" --out "$DEST/Icon-29.png" >/dev/null
          sips -z 40 40 "$SRC" --out "$DEST/Icon-40.png" >/dev/null
          cp "$DEST/Icon-40.png" "$DEST/Icon-40-ipad.png"
          cp "$DEST/Icon-40.png" "$DEST/Icon-40-spot.png"
          sips -z 58 58 "$SRC" --out "$DEST/Icon-58.png" >/dev/null
          cp "$DEST/Icon-58.png" "$DEST/Icon-58-ipad.png"
          sips -z 60 60 "$SRC" --out "$DEST/Icon-60.png" >/dev/null
          sips -z 76 76 "$SRC" --out "$DEST/Icon-76.png" >/dev/null
          sips -z 80 80 "$SRC" --out "$DEST/Icon-80.png" >/dev/null
          cp "$DEST/Icon-80.png" "$DEST/Icon-80-ipad.png"
          sips -z 87 87 "$SRC" --out "$DEST/Icon-87.png" >/dev/null
          sips -z 120 120 "$SRC" --out "$DEST/Icon-120.png" >/dev/null
          cp "$DEST/Icon-120.png" "$DEST/Icon-120-home.png"
          sips -z 152 152 "$SRC" --out "$DEST/Icon-152.png" >/dev/null
          sips -z 167 167 "$SRC" --out "$DEST/Icon-167.png" >/dev/null
          sips -z 180 180 "$SRC" --out "$DEST/Icon-180.png" >/dev/null
          sips -z 1024 1024 "$SRC" --out "$DEST/Icon-1024.png" >/dev/null

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/FurniPlan
        run: xcodegen generate

      - name: Archive signed iPhone/iPad app
        working-directory: ios/FurniPlan
        shell: bash
        run: |
          set -o pipefail
          xcodebuild             -project FurniPlan.xcodeproj             -scheme FurniPlan             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$PWD/build/FurniPlan.xcarchive"             DEVELOPMENT_TEAM=RM95TH446W             CODE_SIGN_STYLE=Automatic             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"             archive | tee archive.log

      - name: Export IPA
        working-directory: ios/FurniPlan
        shell: bash
        run: |
          set -o pipefail
          xcodebuild             -exportArchive             -archivePath "$PWD/build/FurniPlan.xcarchive"             -exportPath "$PWD/build/export"             -exportOptionsPlist ExportOptions.plist             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"             | tee export.log

      - name: Upload IPA to TestFlight
        working-directory: ios/FurniPlan
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$PWD/build/export" -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app             --type ios             --file "$IPA"             --apiKey "$APP_STORE_CONNECT_KEY_ID"             --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FurniPlan-V119-AppStore-IPA
          path: ios/FurniPlan/build/export/*.ipa
          retention-days: 30
