name: Apply FurniPlan V85 Final

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-furniplan-v85.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply final V85 files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, io, json, re
          from PIL import Image, ImageDraw

          root=Path('.')

          patch_gz_b64=''''''

          patch=gzip.decompress(base64.b64decode(patch_gz_b64))
          (root/'v85-final-patch.js').write_bytes(patch)

          # Final web head + patch loader
          index=root/'index.html'
          html=index.read_text(encoding='utf-8', errors='ignore')
          html=re.sub(r'<link[^>]+rel=["\']apple-touch-icon["\'][^>]*>\s*','',html,flags=re.I)
          html=re.sub(r'<link[^>]+rel=["\']icon["\'][^>]*>\s*','',html,flags=re.I)
          html=re.sub(r'<link[^>]+rel=["\']manifest["\'][^>]*>\s*','',html,flags=re.I)
          html=re.sub(r'<meta[^>]+name=["\'](?:apple-mobile-web-app-capable|mobile-web-app-capable|apple-mobile-web-app-title|theme-color)["\'][^>]*>\s*','',html,flags=re.I)
          head_block='''\n<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=85">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=85">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=85">
<link rel="manifest" href="manifest.webmanifest?v=85">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FurniPlan">
<meta name="theme-color" content="#0f172a">
'''
          if '</head>' in html:
              html=html.replace('</head>',head_block+'</head>',1)
          html=re.sub(r'<script[^>]+src=["\']v85-final-patch\.js[^"\']*["\'][^>]*></script>\s*','',html,flags=re.I)
          loader='\n<script src="v85-final-patch.js?v=85"></script>\n'
          if '</body>' in html:
              html=html.replace('</body>',loader+'</body>',1)
          else:
              html+=loader
          index.write_text(html,encoding='utf-8')

          # Unified opaque FurniPlan icon family
          (root/'icons').mkdir(exist_ok=True)
          (root/'build').mkdir(exist_ok=True)
          def make_icon(size):
              img=Image.new('RGB',(size,size),(9,47,72))
              d=ImageDraw.Draw(img)
              # subtle blueprint grid
              step=max(12,size//8)
              for x in range(step,size,step):
                  d.line((x,0,x,size),fill=(19,72,99),width=max(1,size//256))
              for y in range(step,size,step):
                  d.line((0,y,size,y),fill=(19,72,99),width=max(1,size//256))
              m=int(size*.12)
              d.rounded_rectangle((m,m,size-m,size-m),radius=int(size*.14),outline=(42,189,216),width=max(3,int(size*.025)))
              # clean white sofa / furniture plan mark
              y=int(size*.50); x1=int(size*.24); x2=int(size*.76)
              d.rounded_rectangle((x1,y,x2,int(size*.68)),radius=int(size*.055),fill=(245,250,252))
              d.rounded_rectangle((int(size*.20),int(size*.45),int(size*.30),int(size*.68)),radius=int(size*.04),fill=(245,250,252))
              d.rounded_rectangle((int(size*.70),int(size*.45),int(size*.80),int(size*.68)),radius=int(size*.04),fill=(245,250,252))
              d.line((int(size*.34),int(size*.54),int(size*.34),int(size*.66)),fill=(9,47,72),width=max(2,int(size*.015)))
              d.line((int(size*.66),int(size*.54),int(size*.66),int(size*.66)),fill=(9,47,72),width=max(2,int(size*.015)))
              # floor plan corner
              d.line((int(size*.28),int(size*.31),int(size*.55),int(size*.31),int(size*.55),int(size*.42)),fill=(245,250,252),width=max(4,int(size*.025)))
              return img

          for size,path in [
              (180,root/'apple-touch-icon.png'),
              (192,root/'icons/icon-192.png'),
              (512,root/'icons/icon-512.png'),
              (32,root/'favicon-32.png'),
              (512,root/'build/furniplan.png')
          ]:
              make_icon(size).save(path,'PNG')

          ico=make_icon(512)
          ico.save(root/'build/furniplan.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])

          manifest={
            "name":"FurniPlan - تأثيثي",
            "short_name":"FurniPlan",
            "description":"مخطط توزيع الأثاث والقياسات",
            "lang":"ar","dir":"rtl","start_url":"./","scope":"./","display":"standalone","orientation":"any",
            "background_color":"#0f172a","theme_color":"#0f172a",
            "icons":[
              {"src":"icons/icon-192.png?v=85","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"icons/icon-512.png?v=85","sizes":"512x512","type":"image/png","purpose":"any"},
              {"src":"icons/icon-512.png?v=85","sizes":"512x512","type":"image/png","purpose":"maskable"}
            ]
          }
          (root/'manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')

          sw='''const CACHE="furniplan-v85-final-20260925";
self.addEventListener("install",()=>self.skipWaiting());
self.addEventListener("activate",e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
self.addEventListener("fetch",e=>{if(e.request.method!=="GET")return;e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(CACHE).then(x=>x.put(e.request,c)).catch(()=>{});return r;}).catch(()=>caches.match(e.request)));});
'''
          (root/'service-worker.js').write_text(sw,encoding='utf-8')

          package={
            "name":"furniplan-desktop",
            "version":"1.0.85",
            "description":"FurniPlan - تأثيثي، مخطط توزيع الأثاث",
            "main":"desktop/main.js",
            "author":"سدير ياسين محمد",
            "license":"UNLICENSED",
            "scripts":{"dist:win":"electron-builder --win nsis --x64 --publish never"},
            "devDependencies":{"electron":"44.4.5","electron-builder":"26.15.3"},
            "build":{
              "appId":"com.sadeer.furniplan",
              "productName":"FurniPlan - تأثيثي",
              "artifactName":"FurniPlan-Setup-V85-${arch}.exe",
              "asar":True,
              "directories":{"output":"dist","buildResources":"build"},
              "files":[
                "index.html","catalog*.html","manifest.webmanifest","service-worker.js","v13-ipad-fix.js",
                "v85-final-patch.js","startup_splash.png","v45*.*","assets/**/*","icons/**/*",
                "build/furniplan.ico","desktop/main.js","assistant*.json","assistant*.js"
              ],
              "win":{"target":[{"target":"nsis","arch":["x64"]}],"icon":"build/furniplan.ico"},
              "nsis":{
                "oneClick":False,"perMachine":False,"allowToChangeInstallationDirectory":True,
                "createDesktopShortcut":True,"createStartMenuShortcut":True,
                "shortcutName":"FurniPlan - تأثيثي","runAfterFinish":True,"deleteAppDataOnUninstall":False,
                "installerIcon":"build/furniplan.ico","uninstallerIcon":"build/furniplan.ico","installerHeaderIcon":"build/furniplan.ico"
              }
            }
          }
          (root/'package.json').write_text(json.dumps(package,ensure_ascii=False,indent=2),encoding='utf-8')

          mainjs='''const { app, BrowserWindow, shell } = require("electron");
const path = require("path");
app.setName("FurniPlan - تأثيثي");
app.setAppUserModelId("com.sadeer.furniplan");
function createWindow(){
  const win=new BrowserWindow({
    width:1600,height:1000,minWidth:1100,minHeight:700,show:false,autoHideMenuBar:true,
    backgroundColor:"#0f172a",icon:path.join(__dirname,"..","build","furniplan.ico"),
    webPreferences:{contextIsolation:true,nodeIntegration:false,sandbox:true}
  });
  win.loadFile(path.join(__dirname,"..","index.html"));
  win.once("ready-to-show",()=>{win.maximize();win.show();});
  win.webContents.setWindowOpenHandler(({url})=>{
    if(url&&(/^https?:/i).test(url)){shell.openExternal(url);return {action:"deny"};}
    return {action:"allow"};
  });
}
app.whenReady().then(()=>{createWindow();app.on("activate",()=>{if(BrowserWindow.getAllWindows().length===0)createWindow();});});
app.on("window-all-closed",()=>{if(process.platform!=="darwin")app.quit();});
'''
          (root/'desktop').mkdir(exist_ok=True)
          (root/'desktop/main.js').write_text(mainjs,encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check v85-final-patch.js
          node --check desktop/main.js
          python - <<'PY'
          from PIL import Image
          for p in ['apple-touch-icon.png','icons/icon-192.png','icons/icon-512.png','favicon-32.png']:
              im=Image.open(p); im.verify()
              print(p,'OK')
          PY

      - name: Commit final files
        shell: bash
        run: |
          git config user.name "OpenAI FurniPlan Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html v85-final-patch.js apple-touch-icon.png favicon-32.png icons build/furniplan.ico build/furniplan.png manifest.webmanifest service-worker.js package.json desktop/main.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "FurniPlan V85 final web, iOS icons and Windows packaging"
          git pull --rebase origin master
          git push origin master
