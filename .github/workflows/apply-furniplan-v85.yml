name: Apply FurniPlan V85 Final

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-furniplan-v85.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply FurniPlan V85
        run: python .github/scripts/apply_furniplan_v85.py

      - name: Validate
        run: |
          node --check v85-final-patch.js
          node --check desktop/main.js
          python - <<'PY'
          from PIL import Image
          for p in ['apple-touch-icon.png','icons/icon-192.png','icons/icon-512.png','favicon-32.png']:
              im=Image.open(p); im.verify()
              print(p,'OK')
          PY

      - name: Commit final files
        shell: bash
        run: |
          git config user.name "OpenAI FurniPlan Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html v85-final-patch.js apple-touch-icon.png favicon-32.png icons build/furniplan.ico build/furniplan.png manifest.webmanifest service-worker.js package.json desktop/main.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "FurniPlan V85 final web, iOS icons and Windows packaging"
          git pull --rebase origin master
          git push origin master
