name: Build FurniPlan V112

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'package.json'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Create complete backup ZIP
        shell: pwsh
        run: git archive --format=zip --output FurniPlan-V112-Complete.zip HEAD

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FurniPlan-V112-Windows-Installer
          path: dist/FurniPlan-Setup-V112-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FurniPlan-V112-Complete-Backup
          path: FurniPlan-V112-Complete.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish V112 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: FurniPlan-V112
          name: FurniPlan V112
          body: |
            FurniPlan V112 stable.
            Includes the approved iPhone/iPad responsive layout,
            offline readiness status on the splash/login screen,
            Windows installer with desktop/start-menu shortcuts,
            and a complete source backup ZIP.
          files: |
            dist/FurniPlan-Setup-V112-x64.exe
            FurniPlan-V112-Complete.zip
          make_latest: true
