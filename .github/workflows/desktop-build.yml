name: Build FurniPlan V113

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'package.json'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Create complete backup ZIP
        shell: pwsh
        run: git archive --format=zip --output FurniPlan-V113-Complete.zip HEAD

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FurniPlan-V113-Windows-Installer
          path: dist/FurniPlan-Setup-V113-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FurniPlan-V113-Complete-Backup
          path: FurniPlan-V113-Complete.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish V113 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: FurniPlan-V113
          name: FurniPlan V113
          body: |
            FurniPlan V113 Windows fix.
            Disables hardware acceleration to avoid black-window issues,
            starts with a white background and error fallback,
            creates desktop/start-menu shortcuts,
            and uses faster installer compression.
          files: |
            dist/FurniPlan-Setup-V113-x64.exe
            FurniPlan-V113-Complete.zip
          make_latest: true
