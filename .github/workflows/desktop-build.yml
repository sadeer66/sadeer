name: Build FurniPlan V137 Test

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'package.json'
      - 'desktop/main.js'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Verify app files before build
        shell: pwsh
        run: |
          if (!(Test-Path "index.html")) { throw "index.html missing before build" }
          Write-Host "index.html present"
          Get-Item index.html | Format-List FullName,Length

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Verify unpacked app contains index
        shell: pwsh
        run: |
          if (!(Test-Path "dist/win-unpacked/resources/app.asar")) { throw "app.asar missing" }
          npx asar list "dist/win-unpacked/resources/app.asar" | Select-String "index.html"
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect app.asar" }

      - name: Create complete backup ZIP
        shell: pwsh
        run: git archive --format=zip --output FurniPlan-V137-Test-Complete.zip HEAD

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FurniPlan-V137-Test-Windows-Installer
          path: dist/FurniPlan-V137-Test-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FurniPlan-V137-Test-Complete-Backup
          path: FurniPlan-V137-Test-Complete.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish V124 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: FurniPlan-V137-Test
          name: FurniPlan V137 Test
          body: |
            FurniPlan V137 Test.
            Independent Windows test build with direct Electron injection for area naming and T-label fixes.
          files: |
            dist/FurniPlan-V137-Test-Setup-x64.exe
            FurniPlan-V137-Test-Complete.zip
          make_latest: true
