name: Patch V142 Mobile Area Card Drag

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-v142-area-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html and service worker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f"Missing pattern: {label}")
              s=s.replace(old,new,1)

          rep(
          "mapLabels=[],areaPolygons=[],areaDraft=[],areaTouchTap=null,lastAreaResult=null,areaResultTimer=null,pendingCalDistancePx=null",
          "mapLabels=[],areaPolygons=[],areaDraft=[],areaTouchTap=null,areaCardDrag=null,lastAreaResult=null,areaResultTimer=null,pendingCalDistancePx=null",
          "global areaCardDrag"
          )

          rep(
          """function hitTestAreaDelete(p){
  for(let i=areaPolygons.length-1;i>=0;i--){const a=areaPolygons[i];if(pointInBox(p,a._deleteBox))return a;}
  return null;
}""",
          """function hitTestAreaDelete(p){
  for(let i=areaPolygons.length-1;i>=0;i--){const a=areaPolygons[i];if(pointInBox(p,a._deleteBox))return a;}
  return null;
}
function hitTestAreaCard(p){
  for(let i=areaPolygons.length-1;i>=0;i--){
    const a=areaPolygons[i];
    if(pointInBox(p,a._deleteBox))continue;
    if(pointInBox(p,a._cardBox))return a;
  }
  return null;
}""",
          "hitTestAreaCard"
          )

          rep(
          "const p=toCanvasPos(ev),areaDeleteHit=hitTestAreaDelete(p),labelHit=hitTestMapLabel(p),hit=hitTest(p);",
          "const p=toCanvasPos(ev),areaDeleteHit=hitTestAreaDelete(p),areaCardHit=hitTestAreaCard(p),labelHit=hitTestMapLabel(p),hit=hitTest(p);",
          "pointerdown area card hit"
          )

          rep(
          """  if(areaDeleteHit){
    const before=cloneEditState();areaPolygons=areaPolygons.filter(a=>a.id!==areaDeleteHit.id);if(lastAreaResult?.id===areaDeleteHit.id)lastAreaResult=null;draw();commitHistory(before);showAreaResultText('تم حذف المساحة',true);setStatus('تم حذف المساحة المحددة');ev.preventDefault();return;
  }
  if(labelHit){""",
          """  if(areaDeleteHit){
    const before=cloneEditState();areaPolygons=areaPolygons.filter(a=>a.id!==areaDeleteHit.id);if(lastAreaResult?.id===areaDeleteHit.id)lastAreaResult=null;draw();commitHistory(before);showAreaResultText('تم حذف المساحة',true);setStatus('تم حذف المساحة المحددة');ev.preventDefault();return;
  }
  if(areaCardHit){
    areaCardDrag={id:areaCardHit.id,start:{...p},startX:areaCardHit.cardOffsetX||0,startY:areaCardHit.cardOffsetY||0,before:cloneEditState(),moved:false};
    try{canvas.setPointerCapture(ev.pointerId)}catch{}
    setStatus('اسحب بطاقة المساحة إلى المكان المطلوب');
    ev.preventDefault();return;
  }
  if(labelHit){""",
          "pointerdown start area card drag"
          )

          rep(
          """  if(mapLabelDrag){
    const p=toCanvasPos(ev),l=mapLabels.find(x=>x.id===mapLabelDrag.id);if(!l)return;""",
          """  if(areaCardDrag){
    const p=toCanvasPos(ev),a=areaPolygons.find(x=>x.id===areaCardDrag.id);if(!a)return;
    const dx=p.x-areaCardDrag.start.x,dy=p.y-areaCardDrag.start.y;
    a.cardOffsetX=areaCardDrag.startX+dx;
    a.cardOffsetY=areaCardDrag.startY+dy;
    areaCardDrag.moved=Math.hypot(dx,dy)>.01;
    ev.preventDefault();draw();return;
  }
  if(mapLabelDrag){
    const p=toCanvasPos(ev),l=mapLabels.find(x=>x.id===mapLabelDrag.id);if(!l)return;""",
          "pointermove area card drag"
          )

          rep(
          "drag=null;panDrag=null;measureDrag=null;mapLabelDrag=null;snapGuides=[];",
          "drag=null;panDrag=null;measureDrag=null;mapLabelDrag=null;areaCardDrag=null;snapGuides=[];",
          "pinch reset area card drag"
          )

          rep(
          "if(drag&&drag.moved)commitHistory(drag.before);if(measureDrag&&measureDrag.moved)commitHistory(measureDrag.before);if(mapLabelDrag&&mapLabelDrag.moved)commitHistory(mapLabelDrag.before);",
          "if(drag&&drag.moved)commitHistory(drag.before);if(measureDrag&&measureDrag.moved)commitHistory(measureDrag.before);if(mapLabelDrag&&mapLabelDrag.moved)commitHistory(mapLabelDrag.before);if(areaCardDrag&&areaCardDrag.moved)commitHistory(areaCardDrag.before);",
          "commit area card drag"
          )

          rep(
          "drag=null;panDrag=null;measureDrag=null;mapLabelDrag=null;snapGuides=[];mainScroll.classList.remove('panning');",
          "drag=null;panDrag=null;measureDrag=null;mapLabelDrag=null;areaCardDrag=null;snapGuides=[];mainScroll.classList.remove('panning');",
          "end reset area card drag"
          )

          rep(
          """    const cx=a.points.reduce((sum,p)=>sum+p.x,0)/a.points.length,cy=a.points.reduce((sum,p)=>sum+p.y,0)/a.points.length;
    const txt=a.name+'  '+a.areaM2.toFixed(2)+' م² • '+a.perimeterM.toFixed(2)+' م',fs=Math.max(10,13/zoom);""",
          """    const baseCx=a.points.reduce((sum,p)=>sum+p.x,0)/a.points.length,baseCy=a.points.reduce((sum,p)=>sum+p.y,0)/a.points.length;
    const cx=baseCx+(a.cardOffsetX||0),cy=baseCy+(a.cardOffsetY||0);
    const txt=a.name+'  '+a.areaM2.toFixed(2)+' م² • '+a.perimeterM.toFixed(2)+' م',fs=Math.max(10,13/zoom);""",
          "draw area card offset"
          )

          rep(
          """      a._deleteBox={x:xc-xs/2-hitPad,y:yc-xs/2-hitPad,w:xs+hitPad*2,h:xs+hitPad*2};
    }""",
          """      a._deleteBox={x:xc-xs/2-hitPad,y:yc-xs/2-hitPad,w:xs+hitPad*2,h:xs+hitPad*2};
      a._cardBox={x:bx-hitPad,y:by-hitPad,w:bw+hitPad*2,h:bh+hitPad*2};
    }""",
          "store area card hitbox"
          )

          rep(
          "areaPolygons=(p.areaPolygons||p.areas||[]).map(a=>({id:a.id||randId(),name:a.name||'مساحة',points:Array.isArray(a.points)?a.points:[],areaM2:+a.areaM2||0,perimeterM:+a.perimeterM||0}));areaDraft=[];",
          "areaPolygons=(p.areaPolygons||p.areas||[]).map(a=>({id:a.id||randId(),name:a.name||'مساحة',points:Array.isArray(a.points)?a.points:[],areaM2:+a.areaM2||0,perimeterM:+a.perimeterM||0,cardOffsetX:+a.cardOffsetX||0,cardOffsetY:+a.cardOffsetY||0}));areaDraft=[];",
          "restore area card offset"
          )

          p.write_text(s,encoding="utf-8")

          sw=Path("service-worker.js")
          t=sw.read_text(encoding="utf-8")
          import re
          t=re.sub(r"const CACHE='[^']+';","const CACHE='furniplan-v142-core-area-card-drag-20261003';",t,count=1)
          t=t.replace("'./v85-final-patch.js?v=141'","'./v85-final-patch.js?v=142'")
          sw.write_text(t,encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "V142 core mobile area card drag" || exit 0
          git push
