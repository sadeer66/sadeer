<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b48"><title>Sadeer Design Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e0d2;font-family:system-ui,Arial;color:#172c48}header{background:#142b48;color:white;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;min-height:55px}header b{font-size:clamp(15px,2vw,23px)}.brand{color:#e6bc76}nav{display:flex;gap:6px;overflow-x:auto;padding:9px;background:#e9e0d2}button{font:inherit;cursor:pointer;border:1px solid #c4b7a6;background:white;color:#152c48;border-radius:10px;padding:10px 12px;white-space:nowrap}button.active{background:#173d66;color:white;border-color:#173d66}.home{padding:clamp(15px,4vw,42px);text-align:center;max-width:850px;margin:auto}.home h1{font-size:clamp(25px,4vw,42px)}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:24px 0}.tile{white-space:normal;min-height:135px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;box-shadow:0 4px 14px #0001;font-weight:700;font-size:18px}.tile .appicon{display:none}.tile{background:#f7f0e5;border-color:#d7c5ab}.tile .brandmark{font-size:43px;line-height:1;color:#161616}.tile .tagline{font-size:9px;letter-spacing:2px;color:#171717;font-weight:800;direction:ltr}.tile .appname{color:#141414}.tile .appname{font-size:clamp(15px,2.6vw,23px);font-weight:800;direction:ltr}.tile .appname em{font-style:normal;color:#b87b19}.tile span{font-size:32px}.tile small{font-size:12px;font-weight:400}.stage{display:none;height:calc(100dvh - 113px);background:white}.stage iframe{border:0;width:100%;height:100%;display:block}.stage.on{display:block}.hidden{display:none!important}#back{display:none}@media(max-width:500px){header{padding:8px}nav{padding:6px}nav button{font-size:12px;padding:8px}.tiles{gap:10px}.tile{min-height:125px;font-size:15px}.stage{height:calc(100dvh - 105px)}}@media(orientation:landscape) and (max-height:500px){.stage{height:calc(100dvh - 96px)}.home{padding:12px}.tiles{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><b>SADEER <span class="brand">DESIGN STUDIO</span></b><button id="back" onclick="showHome()">⌂ الرئيسية</button></header><nav id="nav"><button class="active" onclick="showHome()">الرئيسية</button><button onclick="openApp(0)">Smart Render</button><button onclick="openApp(1)">FurniPlan</button><button onclick="openApp(2)">SewerPlan</button><button onclick="openApp(3)">ElectricalPlan</button></nav><main class="home" id="home"><h1>مرحباً بك في <span style="color:#ae7d36">Sadeer Design Studio</span></h1><p>مجموعة سدير للتصميم الهندسي — اختر البرنامج للبدء</p><section class="tiles"><button class="tile" onclick="openApp(0)"><span class="brandmark">✦ ▱</span><span class="appname">Smart<em>Render</em></span><span class="tagline">SMART PLAN VISUALIZATION</span><small>الإظهار الذكي للمخططات بدقة وجمال</small></button><button class="tile" onclick="openApp(1)"><span class="brandmark">♧</span><span class="appname">Furni<em>Plan</em></span><span class="tagline">SMART SPACE PLANNING</span><small>Smarter planning .. Better living</small></button><button class="tile" onclick="openApp(2)"><span class="brandmark">▱</span><span class="appname"><em>خارطة</em>Sewer</span><span class="tagline">SMART DRAINAGE PLANNING</span><small>تخطيط مسارات المجاري بدقة</small></button><button class="tile" onclick="openApp(3)"><span class="brandmark">▱</span><span class="appname"><em>Electric</em>كهرباء</span><span class="tagline">SMART ELECTRICAL PLANNING</span><small>تخطيط التمديدات الكهربائية والإنارة بدقة</small></button></section><p style="font-size:12px;color:#746e67">نسخة تجريبية — البرامج الأصلية لم تُعدّل</p></main><section class="stage" id="stage"><iframe id="frame" title="Sadeer application" allow="clipboard-read; clipboard-write; fullscreen" loading="eager"></iframe></section><script>const urls=['../smart-render-v11.74/','../furniplan-v233/','../sewerplan-v128/','../electricalplan-v53/'];let current=-1;function openApp(i){current=i;document.getElementById('home').classList.add('hidden');document.getElementById('stage').classList.add('on');document.getElementById('back').style.display='block';let frame=document.getElementById('frame');if(frame.getAttribute('src')!==urls[i])frame.src=urls[i];document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',j===i+1));}function showHome(){current=-1;document.getElementById('home').classList.remove('hidden');document.getElementById('stage').classList.remove('on');document.getElementById('back').style.display='none';document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',j===0));}</script></body></html>
